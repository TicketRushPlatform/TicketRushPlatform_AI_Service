name: CICD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_OWNER: ticketrushplatform
  IMAGE_NAME: ticketrush-ai_api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Generate image tag
        id: meta
        run: |
          IMAGE=ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

          echo "Using image: $IMAGE"

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image }} \
            .

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            IMAGE=${{ needs.build-and-push.outputs.image }}
              
            echo "Deploying $IMAGE"
  
            sudo kubectl set image deployment/ai-api \
              ai-api=$IMAGE \
              -n ticketrush
  
            sudo kubectl rollout status deployment/ai-api \
              -n ticketrush \
              --timeout=180s
